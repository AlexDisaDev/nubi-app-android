name: Android

# Compila la app en cada push y en cada pull request. El objetivo es
# responder solo a la pregunta "¿esto compila?", que hasta ahora había que
# contestar abriendo Android Studio a mano.
#
# Nota: este repo NO tiene el wrapper de Gradle (faltan `gradlew` y
# `gradle/wrapper/gradle-wrapper.jar`), así que aquí se instala Gradle
# directamente en la versión que pide gradle-wrapper.properties (9.6.0).
# Lo suyo sería generar el wrapper en local con `gradle wrapper` y
# commitearlo: entonces esto puede pasar a usar `./gradlew` y la versión
# queda fijada por el propio repo.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        # OJO: la propia acción @v3 trae por defecto `packages: 'tools
        # platform-tools'`, y ese paquete "tools" es el antiguo "Android SDK
        # Tools" independiente, que Google retiró del repositorio de SDKs
        # hace años — sdkmanager ya no lo encuentra y el paso falla siempre
        # aquí, antes de llegar a compilar nada. Es un valor por defecto
        # obsoleto de la propia acción (su rama principal ya lo quitó y deja
        # solo 'platform-tools'); no es algo que hubiera cambiado yo. Al
        # pedir aquí solo 'platform-tools', Gradle/AGP descargan ellos mismos
        # la plataforma y las build-tools que compileSdk necesite durante el
        # propio "Compilar", que es como se hace normalmente en CI.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Preparar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar
        run: gradle --no-daemon assembleDebug

      - name: Guardar el APK de depuración
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
