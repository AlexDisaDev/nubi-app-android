name: Android

# Compila la app en cada push y en cada pull request. El objetivo es
# responder solo a la pregunta "¿esto compila?", que hasta ahora había que
# contestar abriendo Android Studio a mano.
#
# Nota: este repo NO tiene el wrapper de Gradle (faltan `gradlew` y
# `gradle/wrapper/gradle-wrapper.jar`), así que aquí se instala Gradle
# directamente en la versión que pide gradle-wrapper.properties (9.6.0).
# Lo suyo sería generar el wrapper en local con `gradle wrapper` y
# commitearlo: entonces esto puede pasar a usar `./gradlew` y la versión
# queda fijada por el propio repo.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar
        run: gradle --no-daemon assembleDebug

      - name: Guardar el APK de depuración
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
